name: C++ Automated Labs Test

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Test Task 1 (Polynomials-МНОГОЧЛЕНЫ(от уЖе известного "полином"))
      run: |
        g++ Mycode.cpp -o task1
        echo "4" | ./task1
        
    - name: Test Task 2 (Triangle-ТРЕУГОЛЬНИК)
      run: |
        g++ task2.cpp -o task2
        echo "3 4 5" | ./task2
  
    - name: Test Task 3 (Progression-ПРОГРЕССИЯ)
      run: |
        g++ task3.cpp -o task3
        echo "20" | ./task3
    - name: Test Task 4 (Conditions-УСЛОВИЯ)
      run: |
        g++ task4.cpp -o task4
        echo "4 9 3.3 5.6 3.7 1.4" | ./task4
  
    - name: Test Task 6 (Math Library)
      run: |
        g++ task6.cpp -o task6
        echo "2 3 5 2" | ./task6
  
    - name: Test Task 7 (Switch Operator)
      run: |
        g++ task7.cpp -o task7
        echo "-13.8 8.9 25 56" | ./task7
  
    - name: Test Task 10 (Circles-КРУГИ)
      run: |
          g++ task10.cpp -o task10
          echo "0 0 2 2.5 0 1.5" | ./task10

    - name: Test Task 11 (Time-ВРЕМЯ)
      run: |
          g++ task11.cpp -o task11
          echo "23 50 0 20" | ./task11 # специально подобраны неприятные числа

    - name: Test Task 12-1branch (Biquadratic-БИКВАДРАТНОЕ ЧУДО)
      run: |
          g++ task12-1.cpp -o task12-1
          echo "1 -5 4" | ./task12-1
    - name: Test Task 12-2 (Больше не могу писать на английском, просто 12-2)
      run: |
          g++ task12-2.cpp -o task12-2
          echo "1 -4 5" | ./task12-2

    - name: Test Task 12-3 
      run: |
          g++ task12-3.cpp -o task12-3
          echo "-6 -11" | ./task12-3
