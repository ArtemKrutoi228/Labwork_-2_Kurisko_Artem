name: C++ Automated Labs Test

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Test Task 1 (Polynomials-МНОГОЧЛЕНЫ(от уЖе известного "полином"))
      run: |
        g++ Mycode.cpp -o task1
        echo "4" | ./task1
        
    - name: Test Task 2 (Triangle-ТРЕУГОЛЬНИК)
      run: |
        g++ task2.cpp -o task2
        echo "3 4 5" | ./task2
  
    - name: Test Task 3 (Progression-ПРОГРЕССИЯ)
      run: |
        g++ task3.cpp -o task3
        echo "20" | ./task3
    - name: Test Task 4 (Conditions-УСЛОВИЯ)
      run: |
        g++ task4.cpp -o task4
        echo "4 9 3.3 5.6 3.7 1.4" | ./task4
  
    - name: Test Task 6 (Math Library)
      run: |
        g++ task6.cpp -o task6
        echo "2 3 5 2" | ./task6
  
    - name: Test Task 7 (Switch Operator)
      run: |
        g++ task7.cpp -o task7
        echo "-13.8 8.9 25 56" | ./task7
  
    - name: Test Task 8 (Geometry-ГЕОМЕТРИЯ НАША)
      run: |
        g++ -fsanitize=address,undefined task8.cpp -o task8_asan_ubsan
        echo "-3 1 5 1 2 5" | ./task8_asan_ubsan
        g++ -fsanitize=thread task8.cpp -o task8_tsan
        echo "-3 1 5 1 2 5" | ./task8_tsan
